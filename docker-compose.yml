# Recommended local runtime: one Postgres container plus one full-stack app container.
services:
  postgres:
    image: postgres:16-alpine
    container_name: grindspot-Database
    restart: unless-stopped
    environment:
      POSTGRES_USER: grindspot
      POSTGRES_PASSWORD: grindspot_password
      POSTGRES_DB: grindspot_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grindspot -d grindspot_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_STRIPE_PUBLIC_KEY: pk_test_grindspot_publishable_key_change_me
    container_name: grindspot-App
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://grindspot:grindspot_password@postgres:5432/grindspot_DB
      DIRECT_URL: postgresql://grindspot:grindspot_password@postgres:5432/grindspot_DB
      JWT_SECRET: grindspot-access-token-signing-key-change-me
      JWT_REFRESH_SECRET: grindspot-refresh-token-signing-key-change-me
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 8080
      NODE_ENV: production
      FRONTEND_DIST_PATH: /app/frontend-dist
      CORS_ORIGIN: http://localhost:3000
      AUTO_SEED: "true"
      RUN_MIGRATIONS_ON_STARTUP: "true"
      SEED_ADMIN_EMAIL: admin@grindspot.com
      SEED_ADMIN_PASSWORD: Adminadmin123
      SEED_USER_EMAIL: user@grindspot.com
      SEED_USER_PASSWORD: user123
      STRIPE_SECRET_KEY: sk_test_grindspot_secret_key_change_me
      STRIPE_WEBHOOK_SECRET: whsec_grindspot_webhook_secret_change_me
      UPLOAD_DIR: uploads
    ports:
      - "3000:8080"
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  app_uploads:
  app_logs:
